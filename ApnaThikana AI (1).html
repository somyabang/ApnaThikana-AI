<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ApnaThikana AI</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f6f4;
        --card: #fff;
        --ink: #14262e;
        --mut: #5d6f76;
        --line: #dbe4e1;
        --pri: #0d7a6f;
        --priT: #fff;
        --acc: #f2a900;
        --bad: #b3261e;
        --side: #14262e;
        --sideT: #cfe0dc;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1a1f;
          --card: #16262d;
          --ink: #e6f0ed;
          --mut: #93a8a8;
          --line: #27393f;
          --pri: #2bb5a5;
          --priT: #04201d;
          --side: #0a1317;
          --bad: #ff8a80;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1a1f;
        --card: #16262d;
        --ink: #e6f0ed;
        --mut: #93a8a8;
        --line: #27393f;
        --pri: #2bb5a5;
        --priT: #04201d;
        --side: #0a1317;
        --bad: #ff8a80;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        font-family:
          "Bricolage Grotesque",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        min-height: 100vh;
        line-height: 1.5;
      }
      nav {
        width: 230px;
        background: var(--side);
        color: var(--sideT);
        padding: 20px 12px;
        position: sticky;
        top: 0;
        height: 100vh;
        flex-shrink: 0;
      }
      nav h1 {
        font-size: 20px;
        margin: 0 8px 20px;
        color: #fff;
        font-weight: 800;
      }
      nav h1 span {
        color: var(--acc);
      }
      nav button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        color: inherit;
        font: inherit;
        padding: 10px 12px;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 2px;
      }
      nav button:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      nav button.on {
        background: var(--acc);
        color: #14262e;
        font-weight: 600;
      }
      main {
        flex: 1;
        padding: 28px;
        max-width: 1000px;
        min-width: 0;
      }
      h2 {
        font-size: 28px;
        margin: 0 0 4px;
        font-weight: 800;
      }
      h3 {
        margin: 0 0 10px;
        font-size: 17px;
      }
      .sub {
        color: var(--mut);
        margin: 0 0 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .grid .card {
        margin: 0;
      }
      .big {
        font-size: 30px;
        font-weight: 800;
        line-height: 1.1;
      }
      .lab {
        color: var(--mut);
        font-size: 13px;
      }
      .accentcard {
        border-left: 5px solid var(--acc);
      }
      button.b,
      a.b {
        background: var(--pri);
        color: var(--priT);
        border: 0;
        border-radius: 8px;
        padding: 9px 14px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.b.alt {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      button.b.bad {
        background: var(--bad);
        color: #fff;
      }
      button.b.sm {
        padding: 4px 10px;
        font-size: 13px;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 10px;
        width: 100%;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--mut);
        margin-bottom: 4px;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }
      .act {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .li {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        padding: 9px 0;
        border-top: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .li:first-of-type {
        border-top: 0;
      }
      .tag {
        font-size: 12px;
        border-radius: 99px;
        padding: 2px 9px;
        background: var(--line);
      }
      .tag.ok {
        background: var(--pri);
        color: var(--priT);
      }
      .tag.w {
        background: var(--acc);
        color: #14262e;
      }
      .warn {
        background: var(--acc);
        color: #14262e;
        padding: 10px 12px;
        border-radius: 8px;
        margin-top: 10px;
        font-weight: 600;
      }
      .bar {
        height: 10px;
        background: var(--line);
        border-radius: 9px;
        overflow: hidden;
        margin-top: 8px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--pri);
      }
      .chat {
        max-height: 380px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 12px;
      }
      .m {
        padding: 10px 12px;
        border-radius: 12px;
        max-width: 88%;
        white-space: pre-wrap;
      }
      .m.u {
        align-self: flex-end;
        background: var(--pri);
        color: var(--priT);
      }
      .m.a {
        background: var(--bg);
        border: 1px solid var(--line);
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .chips button {
        background: var(--card);
        border: 1px solid var(--line);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        padding: 6px 11px;
        border-radius: 99px;
        cursor: pointer;
      }
      .empty {
        color: var(--mut);
        padding: 8px 0;
      }
      .note {
        font-size: 13px;
        color: var(--mut);
      }
      .tw {
        overflow-x: auto;
      }
      @media (max-width: 760px) {
        body {
          flex-direction: column;
        }
        nav {
          width: 100%;
          height: auto;
          position: sticky;
          top: 0;
          z-index: 5;
          display: flex;
          gap: 4px;
          overflow-x: auto;
          padding: 10px;
          align-items: center;
        }
        nav h1 {
          display: none;
        }
        nav button {
          width: auto;
          white-space: nowrap;
          margin: 0;
        }
        main {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <nav id="nav">
      <h1>Apna<span>Thikana</span> AI</h1>
    </nav>
    <main id="main"></main>
    <script>
      const PAGES = [
        ["dash", "Dashboard"],
        ["ai", "AI Assistant"],
        ["sav", "Smart Savings"],
        ["room", "Roommate Hub"],
        ["act", "Action Centre"],
        ["set", "Settings"],
      ];
      const fresh = () => ({
        set: { name: "", room: "", budget: 5000, cur: "₹", notif: "in-app" },
        est: [],
        exp: [],
        shared: [],
        chores: [],
        prefs: [],
        rem: [],
        agr: [],
        prop: [],
        log: [],
        chat: [],
      });
      let S = fresh(),
        page = "dash";
      try {
        const d = JSON.parse(localStorage.getItem("apnathikana"));
        if (d) S = Object.assign(fresh(), d);
      } catch (e) {}
      try {
        if (S.set.theme) document.documentElement.dataset.theme = S.set.theme;
      } catch (e) {}
      const save = () => {
        try {
          localStorage.setItem("apnathikana", JSON.stringify(S));
        } catch (e) {}
      };
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const $ = (id) => document.getElementById(id),
        v = (id) => $(id).value.trim(),
        n = (id) => parseFloat($(id).value) || 0;
      const C = () => S.set.cur,
        money = (x) => C() + Math.round(x * 100) / 100;
      const log = (t) => {
        S.log.unshift({ t, d: new Date().toLocaleString() });
        S.log = S.log.slice(0, 40);
      };
      function go(p) {
        page = p;
        save();
        render();
      }
      function render() {
        $("nav").innerHTML =
          "<h1>Apna<span>Thikana</span> AI</h1>" +
          PAGES.map(
            (p) =>
              `<button class="${p[0] == page ? "on" : ""}" onclick="go('${p[0]}')">${p[1]}</button>`,
          ).join("") +
          `<button onclick="toggleTheme()" style="border:1px solid rgba(255,255,255,.25)">${curTheme() == "dark" ? "☀️ Light mode" : "🌙 Dark mode"}</button>`;
        $("main").innerHTML = V[page]();
        scrollTo(0, 0);
        if (page == "ai") {
          const c = $("chat");
          if (c) c.scrollTop = c.scrollHeight;
        }
      }
      const list = (a, f, e) =>
        a.length ? a.map(f).join("") : `<div class="empty">${e}</div>`;
      const spent = () => S.exp.reduce((a, e) => a + e.amt, 0);
      const myShare = () =>
        S.shared.reduce((a, e) => a + e.amt / e.who.length, 0);
      const V = {
        dash() {
          const pc = S.chores.filter((c) => !c.done).length,
            pr = S.rem.filter((r) => !r.done).length,
            le = S.est[0];
          const nm = S.set.name ? ", " + esc(S.set.name) : "";
          return `<h2>Welcome to your Thikana${nm}!</h2><p class="sub">${new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" })}${S.set.room ? " · " + esc(S.set.room) : ""}. You have ${pc} pending chore${pc == 1 ? "" : "s"} and ${pr} reminder${pr == 1 ? "" : "s"}.</p>
 <div class="grid"><div class="card accentcard"><div class="lab">Monthly expenses</div><div class="big">${money(spent() + myShare())}</div><div class="lab">Your expenses + your share of shared bills</div></div>
 <div class="card"><div class="lab">Electricity estimate</div><div class="big">${le ? money(le.cost) : "—"}</div><div class="lab">${le ? "Last saved estimate" : "No estimate saved yet"}</div></div>
 <div class="card"><div class="lab">Pending chores</div><div class="big">${pc}</div><div class="lab">From Roommate Hub</div></div>
 <div class="card"><div class="lab">Reminders</div><div class="big">${pr}</div><div class="lab">Upcoming in Action Centre</div></div></div>
 <div class="card"><h3>Quick actions</h3><div class="act"><button class="b" onclick="go('sav')">Calculate electricity bill</button><button class="b alt" onclick="go('ai')">Ask AI for help</button><button class="b alt" onclick="go('room')">Add a shared expense</button><button class="b alt" onclick="go('act')">Create a reminder</button></div></div>
 <div class="card"><h3>Recent activity</h3>${list(S.log.slice(0, 6), (l) => `<div class="li"><span>${esc(l.t)}</span><span class="note">${esc(l.d)}</span></div>`, "Nothing yet. Add an expense or a chore to get started.")}</div>
 ${S.log.length || S.chores.length || S.shared.length ? "" : '<div class="card"><h3>Just exploring?</h3><p class="note">Load sample data to see every page filled in. You can clear it anytime in Settings.</p><button class="b" onclick="demo()">Load demo data</button></div>'}`;
        },
        sav() {
          const b = +S.set.budget || 0,
            s = spent(),
            pct = b ? Math.min(100, (s / b) * 100) : 0,
            rem = b - s;
          return `<h2>Smart Savings</h2><p class="sub">Calculate your bill, compare scenarios and track your monthly budget.</p>
 <div class="card"><h3>Electricity calculator</h3><div class="row"><div><label>Units used (kWh)</label><input id="u" type="number" min="0" value="150"></div><div><label>Rate per unit (${C()})</label><input id="r" type="number" min="0" step="0.1" value="8"></div><div><label>Fixed charges (optional)</label><input id="f" type="number" min="0" value="0"></div><div><label>Alternative units (to compare)</label><input id="u2" type="number" min="0" value="120"></div></div>
 <div class="act"><button class="b" onclick="calc(0)">Calculate bill</button><button class="b alt" onclick="calc(1)">Compare scenarios</button><button class="b alt" onclick="saveEst()">Save estimate</button></div><div id="out"></div></div>
 <div class="card"><h3>Saved estimates</h3>${list(S.est, (e) => `<div class="li"><span>${e.units} units × ${C()}${e.rate}${e.fixed ? " + " + money(e.fixed) + " fixed" : ""}</span><b>${money(e.cost)}</b></div>`, "No saved estimates yet.")}</div>
 <div class="card"><h3>Monthly budget</h3><div class="row"><div><label>Budget (${C()})</label><input id="bud" type="number" value="${b}"></div><div style="align-self:end"><button class="b alt" onclick="S.set.budget=n('bud');save();render()">Set budget</button></div></div>
 <div class="bar"><i style="width:${pct}%"></i></div><p class="note">${money(s)} spent · ${rem >= 0 ? money(rem) + " remaining" : money(-rem) + " over budget"}</p>
 ${b && s >= b ? '<div class="warn">You are over your monthly budget.</div>' : b && s >= b * 0.8 ? '<div class="warn">You have used ' + Math.round(pct) + "% of your budget.</div>" : ""}
 <div class="row" style="margin-top:14px"><div><label>Expense name</label><input id="en"></div><div><label>Amount</label><input id="ea" type="number" min="0"></div><div style="align-self:end"><button class="b" onclick="addExp()">Add expense</button></div></div>
 ${list(S.exp, (e, i) => `<div class="li"><span>${esc(e.name)}</span><span>${money(e.amt)} <button class="b alt sm" onclick="S.exp.splice(${i},1);save();render()">Remove</button></span></div>`, "No expenses added yet.")}</div>`;
        },
        room() {
          return `<h2>Roommate Hub</h2><p class="sub">Split expenses, share chores and keep preferences in one place.</p>
 <div class="card"><h3>Shared expenses</h3><div class="row"><div><label>Expense</label><input id="sn" placeholder="Groceries"></div><div><label>Total amount</label><input id="sa" type="number" min="0"></div><div><label>Paid by</label><input id="sp" placeholder="You"></div><div><label>Shared by (comma separated)</label><input id="sw" placeholder="You, Aman, Riya"></div></div><button class="b" onclick="addShared()">Add shared expense</button>
 ${list(S.shared, (e, i) => `<div class="li"><span><b>${esc(e.name)}</b> ${money(e.amt)}, paid by ${esc(e.by)}<br><span class="note">${e.who.map((w) => esc(w) + " " + money(e.amt / e.who.length)).join(" · ")}</span></span><button class="b alt sm" onclick="S.shared.splice(${i},1);save();render()">Remove</button></div>`, "No shared expenses yet. A " + C() + "1200 bill split three ways is " + C() + "400 each.")}</div>
 <div class="card"><h3>Chore manager</h3><div class="row"><div><label>Task</label><input id="ct"></div><div><label>Assigned to</label><input id="cw"></div><div><label>Due date</label><input id="cd" type="date"></div></div><button class="b" onclick="addChore()">Add chore</button>
 <div class="tw">${list(S.chores, (c, i) => `<div class="li"><span>${esc(c.t)} · ${esc(c.w || "Unassigned")}${c.d ? " · due " + esc(c.d) : ""}</span><span><span class="tag ${c.done ? "ok" : "w"}">${c.done ? "Completed" : "Pending"}</span> <button class="b alt sm" onclick="toggleChore(${i})">${c.done ? "Undo" : "Mark done"}</button></span></div>`, "No chores yet.")}</div></div>
 <div class="card"><h3>Roommate preferences</h3><div class="row"><div><label>Category</label><select id="pk"><option>Quiet study hours</option><option>Cleaning frequency</option><option>AC usage</option><option>Guest timings</option><option>Shared shopping rules</option></select></div><div><label>Whose preference</label><input id="pw" placeholder="You"></div><div><label>Preference</label><input id="pv" placeholder="AC on at night"></div></div><button class="b" onclick="addPref()">Save preference</button>
 ${list(S.prefs, (p, i) => `<div class="li"><span><b>${esc(p.k)}</b> (${esc(p.w || "You")}): ${esc(p.v)}</span><button class="b alt sm" onclick="S.prefs.splice(${i},1);save();render()">Remove</button></div>`, "No preferences saved yet.")}</div>
 <div class="card"><h3>Compromise suggestions</h3><p class="note">Suggestions are built from your saved preferences. Nothing is saved as an agreement until you approve it in the Action Centre.</p><button class="b" onclick="compromise()">Suggest a compromise</button><div id="comp"></div></div>`;
        },
        act() {
          return `<h2>Action Centre</h2><p class="sub">Review what the assistant proposes. Nothing is saved until you approve it.</p>
 <div class="card accentcard"><h3>Pending approvals</h3>${list(S.prop, (p, i) => `<div class="li"><span><span class="tag w">${p.type == "rem" ? "Proposed reminder" : "Proposed agreement"}</span> ${esc(p.text)}${p.when ? " · " + esc(p.when) : ""}</span><span><button class="b sm" onclick="approve(${i})">Approve</button> <button class="b alt sm" onclick="S.prop.splice(${i},1);save();render()">Reject</button></span></div>`, "No pending approvals.")}</div>
 <div class="card"><h3>Reminders</h3><div class="row"><div><label>Title</label><input id="rt"></div><div><label>Date and time</label><input id="rd" type="datetime-local"></div><div style="align-self:end"><button class="b" onclick="addRem()">Add reminder</button></div></div>
 ${list(S.rem, (r, i) => `<div class="li"><span>${esc(r.t)}${r.d ? " · " + esc(r.d.replace("T", " ")) : ""}</span><span><span class="tag ${r.done ? "ok" : "w"}">${r.done ? "Done" : "Pending"}</span> <button class="b alt sm" onclick="S.rem[${i}].done=!S.rem[${i}].done;log('Reminder '+(S.rem[${i}].done?'completed':'reopened')+': '+S.rem[${i}].t);save();render()">${r.done ? "Undo" : "Mark as done"}</button></span></div>`, "No reminders yet.")}
 <p class="note">Reminders live inside this app. Phone or computer notifications are not sent in this version.</p></div>
 <div class="card"><h3>Agreements</h3><div class="row"><div><label>New agreement</label><input id="ag" placeholder="Cleaning every Sunday, rotating"></div><div style="align-self:end"><button class="b" onclick="addAgr()">Save agreement</button></div></div>${list(S.agr, (a) => `<div class="li"><span>${esc(a.t)}</span><span class="note">${esc(a.d)}</span></div>`, "No agreements saved yet.")}</div>
 <div class="card"><h3>Activity log</h3>${list(S.log, (l) => `<div class="li"><span>${esc(l.t)}</span><span class="note">${esc(l.d)}</span></div>`, "No activity yet.")}</div>`;
        },
        ai() {
          const ch = [
            "Bhai, hamara electricity bill bahut badh raha hai. Kya kar sakte hain?",
            "150 units, rate 8 per unit, bill kitna aayega?",
            "Remind me to check AC usage at 10 pm",
            "Ek roommate ko raat mein AC chahiye, doosre ko bill kam rakhna hai",
          ];
          return `<h2>AI Assistant</h2><p class="sub">Ask in Hinglish or English. It calculates with the real calculator and only proposes actions for you to approve.</p>
 <div class="card"><div class="chips">${ch.map((c) => `<button onclick="ask(this.textContent)">${esc(c)}</button>`).join("")}</div><div class="chat" id="chat">${S.chat.length ? S.chat.map((m) => `<div class="m ${m.r}">${esc(m.t)}</div>`).join("") : '<div class="empty">Pick a prompt above or type your own.</div>'}</div>
 <div class="row" style="grid-template-columns:1fr auto"><input id="q" placeholder="Apni problem likho..." onkeydown="if(event.key=='Enter')ask()"><button class="b" onclick="ask()">Send</button></div>
 <p class="note">This is a local demo assistant using simple rules, not a live AI model. A real model would be connected through a backend so the API key never sits in this page.</p></div>`;
        },
        set() {
          return `<h2>Settings</h2><p class="sub">Your data is saved only in this browser on this device.</p>
 <div class="card"><div class="row"><div><label>Display name</label><input id="sn1" value="${esc(S.set.name)}"></div><div><label>Room / PG details</label><input id="sr" value="${esc(S.set.room)}"></div><div><label>Default monthly budget</label><input id="sb" type="number" value="${S.set.budget}"></div><div><label>Currency symbol</label><select id="sc">${["₹", "$", "€", "£"].map((c) => `<option ${c == C() ? "selected" : ""}>${c}</option>`).join("")}</select></div><div><label>Reminders</label><select id="snt"><option>in-app</option><option ${S.set.notif == "off" ? "selected" : ""}>off</option></select></div><div><label>Theme</label><select id="sth"><option value="">Match device</option><option value="light" ${S.set.theme == "light" ? "selected" : ""}>Light</option><option value="dark" ${S.set.theme == "dark" ? "selected" : ""}>Dark</option></select></div></div>
 <div class="act"><button class="b" onclick="saveSet()">Save settings</button><button class="b bad" onclick="if(confirm('Clear all saved data in this browser?')){S=fresh();document.documentElement.removeAttribute('data-theme');save();render()}">Clear all data</button><button class="b alt" onclick="demo()">Load demo data</button></div></div>`;
        },
      };
      function calc(cmp) {
        const u = n("u"),
          r = n("r"),
          f = n("f"),
          c = u * r + f;
        let h = `<div class="card" style="margin:14px 0 0"><b>Estimated cost: ${money(c)}</b><br><span class="note">${u} units × ${C()}${r}${f ? " + " + money(f) + " fixed" : ""} = ${money(c)}</span>`;
        if (cmp) {
          const u2 = n("u2"),
            c2 = u2 * r + f;
          h += `<div class="tw"><table style="width:100%;margin-top:8px"><tr><td></td><td>Usage</td><td>Rate</td><td>Estimated cost</td></tr><tr><td>Current</td><td>${u}</td><td>${C()}${r}</td><td>${money(c)}</td></tr><tr><td>Alternative</td><td>${u2}</td><td>${C()}${r}</td><td>${money(c2)}</td></tr></table></div><span class="note">Difference: ${money(c - c2)}. This is an estimate, not a guaranteed saving.</span>`;
        }
        $("out").innerHTML = h + "</div>";
      }
      function saveEst() {
        const u = n("u"),
          r = n("r"),
          f = n("f");
        S.est.unshift({ units: u, rate: r, fixed: f, cost: u * r + f });
        log("Electricity estimate saved: " + money(u * r + f));
        save();
        render();
      }
      function addExp() {
        if (!v("en") || !n("ea")) return;
        S.exp.push({ name: v("en"), amt: n("ea") });
        log("Expense added: " + v("en") + " " + money(n("ea")));
        save();
        render();
      }
      function addShared() {
        const who = v("sw")
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean);
        if (!v("sn") || !n("sa") || !who.length)
          return alert("Add a name, an amount and at least one person.");
        S.shared.push({
          name: v("sn"),
          amt: n("sa"),
          by: v("sp") || "You",
          who,
        });
        log("Shared expense added: " + v("sn") + " " + money(n("sa")));
        save();
        render();
      }
      function addChore() {
        if (!v("ct")) return;
        S.chores.push({ t: v("ct"), w: v("cw"), d: v("cd"), done: false });
        log("Chore added: " + v("ct"));
        save();
        render();
      }
      function toggleChore(i) {
        const c = S.chores[i];
        c.done = !c.done;
        if (c.done) log("Chore completed: " + c.t);
        save();
        render();
      }
      function addPref() {
        if (!v("pv")) return;
        S.prefs.push({ k: v("pk"), w: v("pw"), v: v("pv") });
        save();
        render();
      }
      function compromise() {
        const t = S.prefs
          .map((p) => p.k + " " + p.v)
          .join(" ")
          .toLowerCase();
        let s;
        if (!S.prefs.length)
          s =
            "Save at least two preferences first, then I can suggest a compromise.";
        else if (/ac/.test(t)) {
          s =
            "Compromise: run the AC at 26°C on a timer until 1 AM, and use a fan afterwards. Split the extra electricity cost by hours of use.";
          S.prop.unshift({
            type: "agr",
            text: "AC at 26°C on a timer until 1 AM; extra electricity cost split by hours of use",
          });
        } else {
          s =
            "Compromise: write down one rule for each preference, review it together after two weeks, and adjust.";
          S.prop.unshift({
            type: "agr",
            text: "Review roommate preferences together every two weeks",
          });
        }
        save();
        $("comp").innerHTML =
          `<div class="card" style="margin:12px 0 0">${esc(s)}${S.prop.length && S.prop[0].type == "agr" ? '<br><button class="b sm" style="margin-top:8px" onclick="go(\'act\')">Review in Action Centre</button>' : ""}</div>`;
      }
      function addRem() {
        if (!v("rt")) return;
        S.rem.push({ t: v("rt"), d: v("rd"), done: false });
        log("Reminder created: " + v("rt"));
        save();
        render();
      }
      function addAgr() {
        if (!v("ag")) return;
        S.agr.unshift({ t: v("ag"), d: new Date().toLocaleDateString() });
        log("Agreement saved: " + v("ag"));
        save();
        render();
      }
      function approve(i) {
        const p = S.prop.splice(i, 1)[0];
        if (p.type == "rem") {
          S.rem.push({ t: p.text, d: "", done: false, note: p.when });
          log("Reminder approved: " + p.text);
        } else {
          S.agr.unshift({ t: p.text, d: new Date().toLocaleDateString() });
          log("Agreement approved: " + p.text);
        }
        save();
        render();
      }
      function saveSet() {
        S.set.name = v("sn1");
        S.set.room = v("sr");
        S.set.budget = n("sb");
        S.set.cur = $("sc").value;
        S.set.notif = $("snt").value;
        S.set.theme = $("sth").value;
        if (S.set.theme) document.documentElement.dataset.theme = S.set.theme;
        else document.documentElement.removeAttribute("data-theme");
        save();
        render();
      }
      function demo() {
        S.exp.push(
          { name: "Wi-Fi", amt: 600 },
          { name: "Water can", amt: 120 },
        );
        S.shared.push({
          name: "Groceries",
          amt: 1200,
          by: "You",
          who: ["You", "Roommate A", "Roommate B"],
        });
        S.chores.push(
          { t: "Clean room", w: "Roommate A", d: "", done: false },
          { t: "Buy groceries", w: "You", d: "", done: true },
          { t: "Take out trash", w: "Roommate B", d: "", done: false },
        );
        S.est.unshift({ units: 150, rate: 8, fixed: 0, cost: 1200 });
        S.rem.push({ t: "Pay rent", d: "", done: false });
        S.prefs.push(
          { k: "AC usage", w: "Roommate A", v: "AC at night" },
          { k: "AC usage", w: "You", v: "keep the bill low" },
        );
        log("Demo data loaded");
        save();
        render();
      }
      function curTheme() {
        return (
          S.set.theme ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light")
        );
      }
      function toggleTheme() {
        S.set.theme = curTheme() == "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = S.set.theme;
        save();
        render();
      }
      function ask(t) {
        const m = (t || v("q")).trim();
        if (!m) return;
        S.chat.push({ r: "u", t: m });
        const l = m.toLowerCase();
        let a;
        const um = m.match(/(\d+(?:\.\d+)?)\s*(?:units?|kwh)/i),
          rm =
            m.match(/(?:₹|rs\.?\s*)\s*(\d+(?:\.\d+)?)/i) ||
            m.match(/(?:rate|@)\D{0,6}(\d+(?:\.\d+)?)/i) ||
            m.match(/(\d+(?:\.\d+)?)\s*(?:per unit|\/unit)/i);
        if (um && rm) {
          const u = +um[1],
            r = +rm[1],
            c = u * r;
          a = `Calculated with the bill calculator: ${u} units × ${C()}${r} = ${money(c)} before fixed charges.\nIf you cut usage by 20% (${Math.round(u * 0.8)} units) it would be about ${money(u * 0.8 * r)}. That is an estimate, not a guaranteed saving.\nOpen Smart Savings to save this estimate.`;
        } else if (/remind/.test(l)) {
          const w = m.match(/\d{1,2}(?::\d{2})?\s*(?:am|pm|baje)/i),
            title =
              m
                .replace(/^.*?remind(?: me)?(?: to)?/i, "")
                .replace(
                  /\s*(?:at|by)?\s*\d{1,2}(?::\d{2})?\s*(?:am|pm|baje)/i,
                  "",
                )
                .trim() || m;
          S.prop.unshift({ type: "rem", text: title, when: w ? w[0] : "" });
          a = `I have proposed a reminder: “${title}”${w ? " at " + w[0] : ""}. It is not saved yet. Approve it in the Action Centre.`;
        } else if (/\bac\b|roommate|compromise/.test(l)) {
          S.prop.unshift({
            type: "agr",
            text: "AC at 26°C on a timer until 1 AM; extra electricity cost split by hours of use",
          });
          a =
            "A fair middle path: run the AC at 26°C on a timer until about 1 AM, then switch to a fan, and split the extra electricity cost by hours of use. I have proposed this as an agreement. Approve it in the Action Centre if both of you agree.";
        } else if (/bill|electric|bijli|light/.test(l))
          a =
            "Pehle usage aur per-unit rate compare karte hain. Tell me your units (kWh) and rate, for example “150 units, rate 8”, and I will calculate the estimate. Reducing AC hours and switching off unused lights are the usual first scenarios to test.";
        else if (/split|expense|kharcha/.test(l))
          a =
            "Open Roommate Hub, add the expense, who paid and who shares it. Each person’s share is calculated automatically.";
        else
          a =
            "I can help with electricity bill estimates, shared expenses, chores, reminders and roommate compromises. Try: “150 units, rate 8 per unit”.";
        S.chat.push({ r: "a", t: a });
        save();
        render();
      }
      render();
    </script>
  </body>
</html>
